services:
  postgres:
    image: postgres:16.3
    container_name: clinicdb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinicdb
    networks:
      - clinic-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4container_clinic
    ports:
      - "15432:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - clinic-network

networks:
  clinic-network:
    driver: bridge